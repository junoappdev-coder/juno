<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUNO</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f7f8f6;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app {
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    .message {
      font-size: 20px;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <div>
  <button onclick="record('起床')">起きる</button>
  <button onclick="record('就寝')">寝る</button>
</div>

<p id="status">まだ記録がありません</p>

<script>
function record(type) {
  const now = new Date();
  const time = now.toLocaleString('ja-JP');
  document.getElementById('status').innerText =
    type + '：' + time;
}
</script>
  <div class="app">
    <h1>JUNO</h1>
    <div class="message">
      <p id="status">状態　　　待機中</p>
      <p id="lastActivity">最終活動　---</p>
    </div>
  </div>

  <script>
    function recordActivity() {
      const now = new Date();

      const time = now.toLocaleTimeString("ja-JP", {
        hour: "2-digit",
        minute: "2-digit"
      });

      document.getElementById("lastActivity").textContent =
        "最終活動　" + time;

      document.getElementById("status").textContent =
        "状態　　　活動あり";

      localStorage.setItem("lastActivity", time);
    }

    window.onload = function () {
      const savedActivity =
        localStorage.getItem("lastActivity");

      if (savedActivity) {
        document.getElementById("lastActivity").textContent =
          "最終活動　" + savedActivity;
      }
    };

    // ページアクセス時に活動を記録
    recordActivity();
  </script>
</body>
</html>
