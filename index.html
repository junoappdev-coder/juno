<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUNO</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f7f8f6;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app {
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    .message {
      font-size: 20px;
      line-height: 1.8;
    }
  </style>
</head>

<script>
  function recordActivity() {
    const now = new Date();

    const time = now.toLocaleTimeString("ja-JP", {
      hour: "2-digit",
      minute: "2-digit"
    });

    document.getElementById("lastActivity").textContent =
      "最終活動　" + time;

    document.getElementById("status").textContent =
      "状態　　　活動あり";

    localStorage.setItem("lastActivity", time);
  }

  const savedActivity = localStorage.getItem("lastActivity");

  if (savedActivity) {
    document.getElementById("lastActivity").textContent =
      "最終活動　" + savedActivity;
  }
<script>
  function recordActivity() {
    const now = new Date();

    const time = now.toLocaleTimeString("ja-JP", {
      hour: "2-digit",
      minute: "2-digit"
    });

    localStorage.setItem("lastActivity", time);

    document.getElementById("lastActivity").textContent =
      "最終活動　" + time;

    document.getElementById("status").textContent =
      "状態　　　活動あり";
  }

  window.onload = function () {
    const savedActivity =
      localStorage.getItem("lastActivity");

    if (savedActivity) {
      document.getElementById("lastActivity").textContent =
        "最終活動　" + savedActivity;
    }
  };
</script>
