<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUNO</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f7f8f6;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app {
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    .message {
      font-size: 20px;
      line-height: 1.8;
    }
  </style>
</head>

<script>
  const junoData = {
    name: "純子さん",
    lastActivity: "10:30",
    battery: "72%",
    lastCharge: "07:15",
    status: "活動あり"
  };

  document.querySelector("h2").textContent = junoData.name;

  const information = document.querySelectorAll(".message p");

  information[0].textContent = "最終活動　" + junoData.lastActivity;
  information[1].textContent = "バッテリー　" + junoData.battery;
  information[2].textContent = "最終充電　" + junoData.lastCharge;
  information[3].textContent = "状態　　　" + junoData.status;
</script>

<body>
  <div class="app">
    <h1>JUNO</h1>

  <div class="message">
  <h2>純子さん</h2>

  <p id="lastActivity">最終活動　10:30</p>
  <p>バッテリー　72%</p>
  <p>最終充電　07:15</p>
  <p id="status">状態　　　活動あり</p>

  <button onclick="recordActivity()">
    今活動した
  </button>
</div>
</body>
</html>
